title = "Honest with the problem"
content = "No empty rhetoric; every claim I write down should survive one more \"why\"."

[[items]]
icon = "messages-square"
title = "Open with others"
content = "I don't work behind closed doors. I ask, discuss and learn from people, with neither deference nor pride getting in the way."

[[items]]
icon = "compass"
title = "Self-driven in learning"
content = "I don't wait for a path to be laid out; I fill in what I lack, review what I've done, and keep going."

[[items]]
icon = "waves"
title = "Calm with the unknown"
content = "Uncertainty is not noise to be eliminated; it is part of every real system."
