[[items]]
title = "Be rigorous, and stay faithful to the problem"
content = "No empty rhetoric; every claim I write down should hold up when pushed one layer deeper."

[[items]]
title = "Be self-driven within the system's boundaries"
content = "Rather than wait for a path to be laid out, I go looking for opportunities, fill in what I lack, and build something with the resources at hand."

[[items]]
title = "Live with uncertainty"
content = "Uncertainty is not noise to be eliminated; it is part of any real system."
