[[items]]
title = "ThERA Lab: Autonomous Ultrasound Scanning"
subtitle = "Research Intern, Great Bay University"
date = "Feb - Mar 2026"
content = "Achieved cross-modal sensor alignment for autonomous ultrasound scanning by introducing velocity adjoint transformations and hardware timestamp synchronization across heterogeneous sensor streams (500Hz force/kinematics vs. 60Hz imaging). Built a first-order affine model under continuum mechanics assumptions for 4D physical feature extraction, with Savitzky-Golay filtering and confidence masking to suppress speckle noise. As exploratory work outside the published paper, tried a Control-Evaluation dual-track Jacobian decoupling design with Lyapunov stability analysis and Smith Predictor latency compensation (33ms). Third author of the resulting paper accepted at *IROS 2026*, responsible for data processing, statistical analysis and visualization."
tags = ["Robotics", "Sensor Fusion", "Control Theory", "Computer Vision"]

[[items]]
title = "Final-Year Thesis: Hedging under Rough Volatility"
subtitle = "Graded A, supervised by Prof. Liu Jie"
date = "2025 - 2026"
content = "A fractional kernel embedding architecture for deep hedging under rough volatility models, which are non-Markovian with long memory. Malliavin calculus is used to fix the singular kernel so that the network only learns the regular part, and a conditional O(N^{-2H}) convergence result is derived under a stated approximation-error assumption. This line of work became my final-year thesis, *Malliavin Calculus for Variance-Optimal Hedging under Rough Volatility*, graded A."
tags = ["Mathematical Finance", "Stochastic Analysis", "Malliavin Calculus", "Deep Learning"]

[[items]]
title = "2025 CUMCM: NIPT Dynamic Optimal Strategy (C Problem)"
subtitle = "Team Lead — International Track Second Prize"
