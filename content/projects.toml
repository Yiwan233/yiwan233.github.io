[[items]]
title = "Huashu Cup: Foreign Tourist Attractiveness in China"
subtitle = "National Second Prize — Entropy-TOPSIS Model"
date = "2024"
content = "Scraped and integrated multi-dimensional data across 340+ Chinese cities covering four axes: transportation accessibility, climate comfort, environmental quality, and tourism resource density. Applied the entropy weight method to objectively determine indicator weights, then used TOPSIS to rank cities by composite tourist attractiveness. Identified regional patterns and provided data-driven recommendations for inbound tourism optimization."
tags = ["TOPSIS", "Entropy Weight Method", "Data Analysis", "Web Scraping"]

