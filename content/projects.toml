content = "Built a multi-objective optimization model using 0-1 integer programming with four-dimensional decision variables (teacher, classroom, class, time slot) and an improved genetic algorithm featuring BlockXO crossover and adaptive mutation operators. Encoded hard constraints (conflict avoidance, capacity matching, forbidden scheduling rules) and soft constraints (preference satisfaction, resource concentration, workload balance). Applied constraint pre-filtering and hierarchical solving for the Chaoxing Group enterprise challenge."
