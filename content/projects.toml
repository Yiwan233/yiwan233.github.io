content = "Designed a refined patient stratification framework for NIPT (Non-Invasive Prenatal Testing) data, integrating statistical hypothesis testing with dynamic programming to construct an optimal sequential decision model. Built interpretable diagnostic outputs combining likelihood ratios and risk thresholds, enabling personalized screening strategies that balance sensitivity and specificity across heterogeneous populations."
