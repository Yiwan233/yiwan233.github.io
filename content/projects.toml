[[items]]
title = "AI-Based University Smart Course Scheduling"
subtitle = "16th China Service Outsourcing Innovation Contest — Regional Third Prize"
date = "2025"
content = "Built a multi-objective optimization model using 0-1 integer programming with four-dimensional decision variables (teacher, classroom, class, time slot) and an improved genetic algorithm featuring BlockXO crossover and adaptive mutation operators. Encoded hard constraints (conflict avoidance, capacity matching, forbidden scheduling rules) and soft constraints (preference satisfaction, resource concentration, workload balance). Applied constraint pre-filtering and hierarchical solving for the Chaoxing Group enterprise challenge."
tags = ["Integer Programming", "Genetic Algorithm", "Optimization", "AI"]

[[items]]
title = "EY-Gorton ESG Challenge"
subtitle = "Core Lead, Environment Module — National Top 4 & NE China Champion"
date = "2024"
image = "/awards/ey-esg-award.jpg"
content = "Led the Environment Module of a 'Lithium Innovation & Precision Agriculture' synergy plan bridging battery technology and sustainable farming. Researched and compared precision-agriculture spraying technologies, such as loaded-droplet formulations and centrifugal atomization. Using published industry data, compared Direct Lithium Extraction (DLE) with evaporation-based extraction: about 85.5% less water and 70% lower carbon footprint than solar evaporation."
