[[items]]
title = "ThERA Lab: Surgical Robotics Research"
subtitle = "Research Intern, Great Bay University"
date = "2026 - Present"
content = "Achieved cross-modal sensor alignment for robotic surgery by introducing velocity adjoint transformations and hardware timestamp synchronization across heterogeneous sensor streams (500Hz force/kinematics vs. 60Hz imaging). Built a first-order affine model under continuum mechanics assumptions for 4D physical feature extraction, with Savitzky-Golay filtering and confidence masking to suppress speckle noise. Proposed a Control-Evaluation dual-track Jacobian decoupling architecture with Lyapunov stability analysis and Smith Predictor latency compensation (33ms). Targeting *IROS / MICCAI*."
tags = ["Robotics", "Sensor Fusion", "Control Theory", "Computer Vision"]

