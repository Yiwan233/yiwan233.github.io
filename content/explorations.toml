tag = "Aug 2026 · HKUST(GZ)"
title = "Red Bird Challenge Camp"
content = "With teammates from several disciplines, we started from a real need and built a smart lunch box for people with type 2 diabetes; I was solely responsible for its glucose-response model. On a visit to a low-altitude safety company, an engineer told me something I still remember: on a production line, the models people trust are the ones where every number can be explained."

