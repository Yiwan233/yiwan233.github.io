title = "粗糙波动率下的深度对冲"
subtitle = "第一作者兼通讯作者"
date = "2025 - 至今"
content = "提出了一种新颖的分数核嵌入架构，用于粗糙波动率模型下的深度对冲。利用 Malliavin 微积分解决非马尔可夫长记忆特性。证明了极小极大最优收敛速率。*AIMS Mathematics* 大修中。"
