title = "ThERA 实验室：手术机器人研究"
subtitle = "研究实习生，大湾区大学"
date = "2026 - 至今"
content = "机器人手术中的跨模态传感器对齐（500Hz/60Hz）。构建一阶仿射模型提取四维物理特征。提出控制-评估双轨雅可比解耦架构，结合 Lyapunov 稳定性分析。目标 IROS / MICCAI。"
tags = ["机器人学", "传感器融合", "控制理论", "计算机视觉"]

