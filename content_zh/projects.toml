[[items]]
title = "2025 国赛：NIPT检测的动态最优策略（C题）"
subtitle = "团队负责人 — 国际赛道二等奖"
date = "2025"
content = "设计NIPT（无创产前检测）数据的精细化患者分层框架，将统计假设检验与动态规划相结合，构建最优序贯决策模型。融合似然比与风险阈值的可解释诊断输出，在异质性人群中实现灵敏度与特异度的个性化平衡。"
tags = ["数学建模", "统计学习", "医学AI", "优化"]

[[items]]
title = "基于AI的大学智慧排课系统"
subtitle = "第十六届服创大赛 — 区级三等奖"
date = "2025"
content = "采用0-1整数规划构建四维决策变量（教师、教室、班级、时间）的多目标优化模型，设计改进遗传算法（BlockXO交叉算子、自适应变异）。编码硬约束（冲突避免、容量匹配、禁排规则）与软约束（偏好满足度、资源集中度、负载均衡度），通过约束预筛选与分层求解策略完成超星集团企业命题。"
tags = ["整数规划", "遗传算法", "优化", "AI"]

[[items]]
title = "华数杯：老外游中国 — 城市旅游魅力评价"
subtitle = "全国二等奖 — 熵权-TOPSIS 模型"
date = "2024"
content = "爬虫采集并整合全国 340+ 城市的多维数据，覆盖交通可达性、气候舒适度、环境质量与旅游资源密度四大维度。采用熵权法客观确定指标权重，以 TOPSIS 法计算各城市综合旅游魅力指数并排序。识别区域分布规律，为入境旅游优化提供数据驱动的决策建议。"
tags = ["TOPSIS", "熵权法", "数据分析", "爬虫"]

[[items]]
title = "粗糙波动率下的深度对冲"
subtitle = "第一作者兼通讯作者"
date = "2025 - 至今"
content = "提出了一种新颖的分数核嵌入架构，用于粗糙波动率模型下的深度对冲。利用 Malliavin 微积分解决非马尔可夫长记忆特性。证明了极小极大最优收敛速率。2026年3月投稿；2026年5月收到 *AIMS Mathematics* 大修意见。"
tags = ["数学金融", "随机分析", "Malliavin 微积分", "深度学习"]

[[items]]
title = "ThERA 实验室：手术机器人研究"
subtitle = "研究实习生，大湾区大学"
date = "2026 - 至今"
content = "引入速度伴随变换与硬件时间戳同步，实现跨模态传感器数据流（500Hz力/运动学 vs. 60Hz影像）的物理对齐。在连续介质力学假设下构建一阶仿射模型提取四维核心物理特征，以 Savitzky-Golay 滤波与置信度掩膜抑制散斑噪声。提出控制-评估双轨雅可比解耦架构，结合 Lyapunov 稳定性分析与 Smith 预估器（33ms延迟补偿）。目标 IROS / MICCAI。"
tags = ["机器人学", "传感器融合", "控制理论", "计算机视觉"]

[[items]]
title = "安永 Gorton ESG 挑战赛"
subtitle = "环境模块核心负责人 — 全国四强 & 东北赛区冠军"
date = "2024"
content = "设计「锂电创新与精准农业」协同方案，桥接电池技术与可持续农业。基于计算流体力学构建液滴漂移抑制物理模型，优化喷嘴参数使农药覆盖率从 10% 提升至 50%，同时减少化学径流。通过对比生命周期建模，量化直接锂提取（DLE）相对传统盐湖提锂的生态价值，预计减少 85.5% 用水量并显著改善碳排放。"
tags = ["ESG", "可持续发展", "数学建模"]

[[items]]
title = "YADA 智能存储 & Lightseeker 太阳能"
subtitle = "算法与运营专员"
date = "2024"
content = "使用 C++ 为 HX711 硬件传感器开发重量锁定-监测-触发（Weight Lock-Monitor-Trigger）模型，通过动态阈值比对实现实时重量锁定逻辑，检测未经授权的取件行为，将配送盗窃率从两位数降至 4.1%。在 Lightseeker 太阳能项目中，推动跨境产业合作（签署谅解备忘录），协调马来西亚 1000m² 智能温室试点运营，集成物联网环境监测。"
tags = ["C++", "IoT", "硬件", "运营"]

[[items]]
title = "模法师圆桌（MFA Round Table）"
subtitle = "创始人兼负责人"
date = "2025 - 至今"
